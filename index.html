<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BMLT 157-Byte Oasis Sapphire Testnet Portal</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; background: #0d1117; color: #e6edf3; padding: 20px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; margin-bottom: 24px; }
    button { background: #238636; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    button:hover { background: #2ea043; }
    input { margin: 8px 0; display: block; width: 100%; padding: 8px; background: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 4px; }
    pre { background: #010409; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 13px; color: #7ee787; }
  </style>
</head>
<body>
  <h1>BMLT Strict 157-Byte TEE Portal (Sapphire Testnet)</h1>

  <div class="card">
    <h3>1. Configuration & Wallet</h3>
    <label>TEE Backend URL (Your Render / ROFL API Endpoint):</label>
    <input type="text" id="apiUrl" value="http://localhost:8080" />
    <label>LedgerCoreTestnet Contract Address:</label>
    <input type="text" id="contractAddr" value="0xfD0D6Eb2078550C52a1B545f2d8EAEd720C58893" />
    <label>Registered Enclave Signer Address (Node):</label>
    <input type="text" id="nodeAddr" placeholder="0xYourEnclaveSignerAddress" />
    <button onclick="connectWallet()">Connect MetaMask (Sapphire Testnet)</button>
    <p id="walletStatus">Not connected</p>
  </div>

  <div class="card">
    <h3>2. Fold File into 157-Byte .Q Stamp (Mode 0x01)</h3>
    <input type="file" id="foldFile" />
    <button onclick="foldFileToQ()">Pay Fee & Generate .Q File</button>
  </div>

  <div class="card">
    <h3>3. Restore Data from .Q Stamp (Mode 0x02)</h3>
    <label>Anchored Slot ID (Sequence #):</label>
    <input type="number" id="slotId" value="1" />
    <label>Start Block (0 = beginning):</label>
    <input type="number" id="rStart" value="0" />
    <label>End Block (e.g., 90 for full 11KB sample, or slice range):</label>
    <input type="number" id="rEnd" value="90" />
    <label>Select your 157-Byte .Q File:</label>
    <input type="file" id="qFile" />
    <button onclick="restoreFromQ()">Pay Fee & Restore Data</button>
  </div>

  <pre id="logBox">Ready.</pre>

  <script>
    let provider, signer, userAddress;

    const ABI = [
      "function openSessionA(uint64 maxMetric, address node, uint8 mode, bytes32 salt, bytes extKey64) external payable returns (bytes32 refId, bytes payload, bytes32 tHash)",
      "function openSessionB(uint32 slotId, uint64 rStart, uint64 rEnd, address node, uint8 mode, bytes32 salt, bytes extKey64) external payable returns (bytes32 refId, bytes payload, bytes32 tHash)",
      "event RefCommitted(bytes32 indexed refId)"
    ];

    function log(msg) {
      const box = document.getElementById("logBox");
      box.textContent += "\n" + msg;
      box.scrollTop = box.scrollHeight;
    }

    async function connectWallet() {
      if (!window.ethereum) return alert("Install MetaMask!");
      await window.ethereum.request({
        method: "wallet_addEthereumChain",
        params: [{
          chainId: "0x5aff",
          chainName: "Oasis Sapphire Testnet",
          nativeCurrency: { name: "TEST", symbol: "TEST", decimals: 18 },
          rpcUrls: ["https://testnet.sapphire.oasis.io"],
          blockExplorerUrls: ["https://explorer.oasis.io/testnet/sapphire"]
        }]
      });
      provider = new ethers.BrowserProvider(window.ethereum);
      signer = await provider.getSigner();
      userAddress = await signer.getAddress();
      document.getElementById("walletStatus").textContent = "Connected: " + userAddress;
      log("[✓] Connected to Sapphire Testnet: " + userAddress);
    }

    async function foldFileToQ() {
      try {
        const fileInput = document.getElementById("foldFile");
        if (!fileInput.files.length) return alert("Select a file first!");
        const file = fileInput.files[0];

        const contractAddr = document.getElementById("contractAddr").value.trim();
        const nodeAddr = document.getElementById("nodeAddr").value.trim();
        const apiUrl = document.getElementById("apiUrl").value.trim();

        const contract = new ethers.Contract(contractAddr, ABI, signer);
        const salt = "0x" + "aa".repeat(32);
        const extKey64 = "0x" + "00".repeat(64);

        log(`[*] Paying TEST & calling openSessionA for ${file.name} (${file.size} bytes)...`);
        const tx = await contract.openSessionA(
          file.size,
          nodeAddr,
          2,
          salt,
          extKey64,
          { value: ethers.parseEther("5.0") } // Matches 5.0 TEST minCallFee (or 1.0 TEST if lowered)
        );
        log("[*] Transaction sent: " + tx.hash + ". Waiting for confirmation...");
        const receipt = await tx.wait();

        const iface = new ethers.Interface(ABI);
        let refId = null;
        for (const l of receipt.logs) {
          try {
            const parsed = iface.parseLog(l);
            if (parsed && parsed.name === "RefCommitted") refId = parsed.args.refId;
          } catch (e) {}
        }
        if (!refId) throw new Error("RefCommitted event not found in receipt!");
        log("[✓] Payment confirmed! Session refId: " + refId);

        log("[*] Sending payload & refId to TEE Enclave to fold 157-byte .Q stamp...");
        const formData = new FormData();
        formData.append("refId", refId);
        formData.append("account", userAddress);
        formData.append("file", file);

        const resp = await fetch(`${apiUrl}/api/fold`, { method: "POST", body: formData });
        if (!resp.ok) throw new Error(await resp.text());

        const blob = await resp.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = file.name + ".Q";
        a.click();

        log(`[🏆] Downloaded 157-byte ${file.name}.Q! On-Chain Slot ID: ${resp.headers.get("X-Slot-Id")} | Anchor Tx: ${resp.headers.get("X-Anchor-Tx")}`);
      } catch (err) {
        log("[ERROR] " + err.message);
      }
    }

    async function restoreFromQ() {
      try {
        const qInput = document.getElementById("qFile");
        if (!qInput.files.length) return alert("Select your .Q file first!");
        const qFile = qInput.files[0];

        const slotId = parseInt(document.getElementById("slotId").value);
        const rStart = parseInt(document.getElementById("rStart").value);
        const rEnd = parseInt(document.getElementById("rEnd").value);
        const contractAddr = document.getElementById("contractAddr").value.trim();
        const nodeAddr = document.getElementById("nodeAddr").value.trim();
        const apiUrl = document.getElementById("apiUrl").value.trim();

        const contract = new ethers.Contract(contractAddr, ABI, signer);
        const salt = "0x" + "aa".repeat(32);
        const extKey64 = "0x" + "00".repeat(64);

        log(`[*] Paying TEST & calling openSessionB for Slot #${slotId} (blocks ${rStart}..${rEnd})...`);
        const tx = await contract.openSessionB(
          slotId,
          rStart,
          rEnd,
          nodeAddr,
          2,
          salt,
          extKey64,
          { value: ethers.parseEther("5.0") }
        );
        const receipt = await tx.wait();

        const iface = new ethers.Interface(ABI);
        let refId = null;
        for (const l of receipt.logs) {
          try {
            const parsed = iface.parseLog(l);
            if (parsed && parsed.name === "RefCommitted") refId = parsed.args.refId;
          } catch (e) {}
        }
        log("[✓] Rebuild Session opened! refId: " + refId);

        const formData = new FormData();
        formData.append("refId", refId);
        formData.append("account", userAddress);
        formData.append("slotId", slotId);
        formData.append("rStart", rStart);
        formData.append("rEnd", rEnd);
        formData.append("qfile", qFile);

        const resp = await fetch(`${apiUrl}/api/restore`, { method: "POST", body: formData });
        if (!resp.ok) throw new Error(await resp.text());

        const blob = await resp.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "restored_" + qFile.name.replace(".Q", "");
        a.click();

        log(`[🏆] Data restored and downloaded! Settlement Tx: ${resp.headers.get("X-Restore-Tx")}`);
      } catch (err) {
        log("[ERROR] " + err.message);
      }
    }
  </script>
</body>
</html>
