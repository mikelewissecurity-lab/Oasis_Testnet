<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Seal</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
  <style>
    :root {
      --bg: #090a0f;
      --panel: #11131a;
      --border: #1e2230;
      --accent: #22d3ee;
      --accent-hover: #06b6d4;
      --text: #f8fafc;
      --muted: #64748b;
      --success: #10b981;
      --danger: #ef4444;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 2.5rem 1rem;
      max-width: 680px;
      margin: 0 auto;
    }
    header { text-align: center; margin-bottom: 2rem; }
    header h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 0.35rem; }
    header p { color: var(--muted); font-size: 0.85rem; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.1);
      color: var(--success);
    }
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; }
    .tab-btn {
      flex: 1;
      padding: 0.75rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      color: var(--muted);
      cursor: pointer;
      font-weight: 500;
      font-size: 0.9rem;
      transition: all 0.15s;
    }
    .tab-btn.active {
      background: rgba(34, 211, 238, 0.08);
      border-color: var(--accent);
      color: var(--accent);
    }
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.4rem; font-weight: 500; }
    input[type="file"], input[type="text"], input[type="password"] {
      width: 100%;
      padding: 0.75rem;
      background: #050608;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      color: var(--text);
      font-size: 0.88rem;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .btn {
      width: 100%;
      padding: 0.85rem;
      border-radius: 0.5rem;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 0.9rem;
      font-size: 0.8rem;
      width: auto;
    }
    .btn-secondary:hover { border-color: var(--muted); }
    .file-dropzone {
      border: 2px dashed var(--border);
      border-radius: 0.5rem;
      padding: 1.5rem;
      text-align: center;
      background: #050608;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .file-dropzone:hover {
      border-color: var(--accent);
    }
    .file-dropzone p {
      color: var(--text);
      font-size: 0.9rem;
      margin-bottom: 0.25rem;
    }
    .file-dropzone span {
      color: var(--muted);
      font-size: 0.75rem;
    }
    .selected-info {
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: var(--accent);
      font-family: var(--font-mono);
    }
    .log-box {
      background: #050608;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.85rem;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: #94a3b8;
      height: 140px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>

<header>
  <h1>Data Seal</h1>
  <p>Secure Seal &amp; Retrieval</p>
</header>

<div class="card">
  <div class="status-row">
    <div style="display: flex; align-items: center; gap: 0.5rem;">
      <button class="btn btn-secondary" id="btnConnect" onclick="connectWallet()">Connect Wallet</button>
      <span id="walletText" style="font-size: 0.8rem; color: var(--muted); font-family: var(--font-mono);">Not connected</span>
    </div>
    <span class="badge" id="netStatus">Ready</span>
  </div>

  <div class="grid" style="margin-top: 0.75rem;">
    <div class="form-group" style="margin-bottom: 0;">
      <label>Identifier</label>
      <input type="text" id="uid" value="guest" />
    </div>
    <div class="form-group" style="margin-bottom: 0;">
      <label>Key</label>
      <input type="password" id="ukey" value="guest" />
    </div>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" id="tabSealBtn" onclick="setTab('seal')">Seal</button>
  <button class="tab-btn" id="tabOpenBtn" onclick="setTab('open')">Retrieve</button>
</div>

<!-- Tab 1: Seal -->
<div class="card" id="sealCard">
  <div class="form-group">
    <label>Select File to Seal</label>
    <div class="file-dropzone" onclick="document.getElementById('fileIn').click()">
      <p id="sealFilePrompt">Click to browse file</p>
      <span>Accepts any file type up to 100 MB</span>
    </div>
    <input type="file" id="fileIn" style="display: none;" onchange="onFileSelected(this)" />
    <div class="selected-info" id="sealFileInfo"></div>
  </div>
  <button class="btn btn-primary" id="btnSeal" onclick="executeSeal()">Seal File</button>
</div>

<!-- Tab 2: Retrieve -->
<div class="card" id="openCard" style="display: none;">
  <div class="form-group">
    <label>Upload .Q Stamp File</label>
    <div class="file-dropzone" onclick="document.getElementById('stampIn').click()">
      <p id="stampFilePrompt">Click to browse .Q Stamp</p>
      <span>Requires exact 157-byte .Q stamp file</span>
    </div>
    <input type="file" id="stampIn" accept=".Q" style="display: none;" onchange="parseStamp(this)" />
    <div class="selected-info" id="stampFileInfo"></div>
  </div>
  <input type="hidden" id="slotNum" value="1" />
  <input type="hidden" id="blockCount" value="1" />
  <button class="btn btn-primary" id="btnOpen" onclick="executeRetrieve()">Retrieve File</button>
</div>

<div class="card">
  <label>Status</label>
  <div class="log-box" id="logBox">System ready.</div>
</div>

<script>
  const GATEWAY = "https://p8080.m1874.opf-testnet-rofl-9.rofl.app";
  const CONTRACT_ADDR = "0xE97218584eDFEe559457De651c32EaF6637a9d4A";
  const CHAIN_HEX = "0x5aff"; // 23295
  const SIGNER_ADDR = "0x97a5ab9bE3DC35aDbbEe756F2c75bB44ECC81B18";
  const SALT = "0x" + "aa".repeat(32);
  const EXT_KEY = "0x" + "00".repeat(64);

  const ABI = [
    "function openSessionA(uint64 maxMetric, address node, uint8 mode, bytes32 salt, bytes extKey64) external payable returns (bytes32 refId, bytes payload, bytes32 tHash)",
    "function openSessionB(uint32 slotId, uint64 rStart, uint64 rEnd, address node, uint8 mode, bytes32 salt, bytes extKey64) external payable returns (bytes32 refId, bytes payload, bytes32 tHash)",
    "event RefCommitted(bytes32 indexed refId)"
  ];

  let provider = null;
  let signer = null;
  let account = null;

  function print(msg) {
    const el = document.getElementById("logBox");
    el.innerText += `\n${msg}`;
    el.scrollTop = el.scrollHeight;
  }

  function setTab(tab) {
    document.getElementById("sealCard").style.display = tab === "seal" ? "block" : "none";
    document.getElementById("openCard").style.display = tab === "open" ? "block" : "none";
    document.getElementById("tabSealBtn").classList.toggle("active", tab === "seal");
    document.getElementById("tabOpenBtn").classList.toggle("active", tab === "open");
  }

  function onFileSelected(input) {
    const file = input.files[0];
    if (file) {
      document.getElementById("sealFilePrompt").innerText = file.name;
      document.getElementById("sealFileInfo").innerText = `${file.name} (${file.size.toLocaleString()} bytes)`;
    }
  }

  async function connectWallet() {
    if (!window.ethereum) {
      alert("Please install a Web3 wallet.");
      return;
    }
    try {
      await window.ethereum.request({ method: "eth_requestAccounts" });
      const cid = await window.ethereum.request({ method: "eth_chainId" });
      if (cid.toLowerCase() !== CHAIN_HEX) {
        try {
          await window.ethereum.request({
            method: "wallet_switchEthereumChain",
            params: [{ chainId: CHAIN_HEX }]
          });
        } catch (_) {
          await window.ethereum.request({
            method: "wallet_addEthereumChain",
            params: [{
              chainId: CHAIN_HEX,
              chainName: "Sapphire Testnet",
              nativeCurrency: { name: "TEST", symbol: "TEST", decimals: 18 },
              rpcUrls: ["https://testnet.sapphire.oasis.io"],
              blockExplorerUrls: ["https://explorer.oasis.io/testnet/sapphire"]
            }]
          });
        }
      }
      provider = new ethers.BrowserProvider(window.ethereum);
      signer = await provider.getSigner();
      account = await signer.getAddress();
      document.getElementById("walletText").innerText = `${account.slice(0, 6)}...${account.slice(-4)}`;
      document.getElementById("btnConnect").innerText = "Connected";
      print("Wallet connected: " + account);
    } catch (e) {
      print("Connection error: " + e.message);
    }
  }

  async function parseStamp(input) {
    const f = input.files[0];
    if (!f) return;

    document.getElementById("stampFilePrompt").innerText = f.name;

    const match = f.name.match(/\.slot(\d+)\.Q$/i);
    if (match) {
      document.getElementById("slotNum").value = match[1];
    } else {
      document.getElementById("slotNum").value = "1";
    }

    const buf = await f.arrayBuffer();
    if (buf.byteLength === 157) {
      const view = new DataView(buf);
      const totalBytes = Number(view.getBigUint64(0, false));
      const totalBlocks = Math.max(1, Math.ceil(totalBytes / 128));
      document.getElementById("blockCount").value = String(totalBlocks);
      document.getElementById("stampFileInfo").innerText = `Loaded: ${f.name} | Payload: ${totalBytes.toLocaleString()} bytes (${totalBlocks} blocks) | Slot: ${document.getElementById("slotNum").value}`;
      print(`Stamp loaded: ${f.name} (${totalBytes.toLocaleString()} bytes payload, slot ${document.getElementById("slotNum").value})`);
    } else {
      document.getElementById("stampFileInfo").innerText = `Warning: File size is ${buf.byteLength} bytes (expected 157 bytes).`;
      print(`Warning: File size is ${buf.byteLength} bytes (expected 157 bytes).`);
    }
  }

  async function executeSeal() {
    if (!signer) await connectWallet();
    if (!signer) return;

    const file = document.getElementById("fileIn").files[0];
    if (!file) {
      alert("Select a file first.");
      return;
    }

    const uid = document.getElementById("uid").value.trim() || "guest";
    const ukey = document.getElementById("ukey").value.trim() || "guest";
    const btn = document.getElementById("btnSeal");

    try {
      btn.disabled = true;
      print("Initializing...");
      const contract = new ethers.Contract(CONTRACT_ADDR, ABI, signer);

      const metric = Math.max(file.size, 10000000);
      const tx = await contract.openSessionA(
        BigInt(metric),
        SIGNER_ADDR,
        2,
        SALT,
        EXT_KEY,
        { value: ethers.parseEther("5.0"), gasLimit: 500000n }
      );
      print("Confirming transaction...");
      const receipt = await tx.wait();

      const iface = new ethers.Interface(ABI);
      let refId = null;
      for (const item of receipt.logs) {
        try {
          const parsed = iface.parseLog(item);
          if (parsed && parsed.name === "RefCommitted") {
            refId = parsed.args.refId;
            break;
          }
        } catch (_) {}
      }
      if (!refId && receipt.logs.length > 0) refId = receipt.logs[0].topics[1];

      print("Processing file...");
      const fd = new FormData();
      fd.append("refId", refId);
      fd.append("account", account);
      fd.append("username", uid);
      fd.append("password", ukey);
      fd.append("file", file);

      const res = await fetch(`${GATEWAY}/api/fold`, { method: "POST", body: fd });
      if (!res.ok) throw new Error("Server rejected request");

      const blob = await res.blob();
      const slot = res.headers.get("X-Slot-Id") || "1";
      const totalBlocks = res.headers.get("X-Total-Blocks") || String(Math.max(1, Math.ceil(file.size / 128)));

      document.getElementById("slotNum").value = slot;
      document.getElementById("blockCount").value = totalBlocks;

      const url = window.URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${file.name}.slot${slot}.Q`;
      document.body.appendChild(a);
      a.click();
      a.remove();

      print(`Done. Stamp downloaded: ${file.name}.slot${slot}.Q`);
    } catch (e) {
      print("Failed: " + e.message);
    } finally {
      btn.disabled = false;
    }
  }

  async function executeRetrieve() {
    if (!signer) await connectWallet();
    if (!signer) return;

    const file = document.getElementById("stampIn").files[0];
    if (!file) {
      alert("Select a .Q stamp file first.");
      return;
    }

    const uid = document.getElementById("uid").value.trim() || "guest";
    const ukey = document.getElementById("ukey").value.trim() || "guest";
    const slot = parseInt(document.getElementById("slotNum").value, 10) || 1;
    const blocks = parseInt(document.getElementById("blockCount").value, 10) || 1;
    const btn = document.getElementById("btnOpen");

    try {
      btn.disabled = true;
      print("Initializing retrieval...");
      const contract = new ethers.Contract(CONTRACT_ADDR, ABI, signer);

      const tx = await contract.openSessionB(
        slot,
        0n,
        BigInt(blocks),
        SIGNER_ADDR,
        2,
        SALT,
        EXT_KEY,
        { value: ethers.parseEther("5.0"), gasLimit: 500000n }
      );
      print("Confirming retrieval transaction...");
      const receipt = await tx.wait();

      const iface = new ethers.Interface(ABI);
      let refId = null;
      for (const item of receipt.logs) {
        try {
          const parsed = iface.parseLog(item);
          if (parsed && parsed.name === "RefCommitted") {
            refId = parsed.args.refId;
            break;
          }
        } catch (_) {}
      }
      if (!refId && receipt.logs.length > 0) refId = receipt.logs[0].topics[1];

      print("Reconstructing file...");
      const fd = new FormData();
      fd.append("refId", refId);
      fd.append("account", account);
      fd.append("slotId", slot.toString());
      fd.append("rStart", "0");
      fd.append("rEnd", blocks.toString());
      fd.append("username", uid);
      fd.append("password", ukey);
      fd.append("qfile", file);

      const res = await fetch(`${GATEWAY}/api/restore`, { method: "POST", body: fd });
      if (!res.ok) throw new Error("Server rejected request");

      const blob = await res.blob();
      const filename = res.headers.get("X-Original-Filename") || file.name.replace(/\.slot\d+\.Q$/i, "").replace(/\.Q$/i, "");

      const url = window.URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename.startsWith("restored_") ? filename : `restored_${filename}`;
      document.body.appendChild(a);
      a.click();
      a.remove();

      print("Done. File retrieved successfully.");
    } catch (e) {
      print("Failed: " + e.message);
    } finally {
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
