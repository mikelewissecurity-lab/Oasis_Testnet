<div id="hz-shell" style="font-family:monospace;background:#0a0e17;color:#e2e8f0;padding:16px;border-radius:10px;">
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px;">
    <button id="hz-launch" style="background:#00ffcc;color:#041014;border:none;padding:10px 16px;border-radius:6px;font-weight:700;cursor:pointer;">
      Connect Wallet &amp; Pay TEST to Launch Vault
    </button>
    <a href="https://faucet.testnet.oasis.io/?paratime=sapphire" target="_blank" rel="noopener"
       style="color:#00ffcc;font-size:12px;">Get Sapphire TEST Faucet</a>
  </div>
  <div id="hz-msg" style="font-size:13px;color:#8b9bb4;margin-bottom:10px;">Idle — connect MetaMask on Sapphire Testnet.</div>
  <iframe id="hz-frame" style="display:none;width:100%;height:820px;border:1px solid #1f293d;border-radius:8px;" allow="clipboard-write"></iframe>
</div>

<script type="module">
  import { ethers } from "https://cdn.jsdelivr.net/npm/ethers@6.13.4/+esm";

  const REGISTRY_ADDR = "0xE5F62b7e51fe92D8F310F3070b6888D1AC6cFbee";
  const ENCLAVE_URL   = "https://p42269.m1891.opf-testnet-rofl-25.rofl.app";
  const SAPPHIRE_TEST = {
    chainId: "0x5aff",
    chainName: "Oasis Sapphire Testnet",
    nativeCurrency: { name: "TEST", symbol: "TEST", decimals: 18 },
    rpcUrls: ["https://testnet.sapphire.oasis.io"],
    blockExplorerUrls: ["https://explorer.oasis.io/testnet/sapphire"]
  };
  const REGISTRY_ABI = [
    "function unitFee() external view returns (uint256)"
  ];

  const msgEl   = document.getElementById("hz-msg");
  const frameEl = document.getElementById("hz-frame");

  async function switchSapphire() {
    if (!window.ethereum) throw new Error("MetaMask not detected.");
    try {
      await window.ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId: SAPPHIRE_TEST.chainId }] });
    } catch (e) {
      if (e.code === 4902) {
        await window.ethereum.request({ method: "wallet_addEthereumChain", params: [SAPPHIRE_TEST] });
      } else throw e;
    }
  }

  async function waitForEnclaveWake() {
    for (let i = 1; i <= 30; i++) {
      try {
        const r = await fetch(`${ENCLAVE_URL}/health`, { cache: "no-store" });
        if (r.ok) {
          const j = await r.json();
          if (j.status === "ok") return j;
        }
      } catch (_) {}
      msgEl.textContent = `Waiting for Intel TDX enclave to wake... (${i * 3}s)`;
      await new Promise(res => setTimeout(res, 3000));
    }
    throw new Error("Enclave wake timeout (90s).");
  }

  document.getElementById("hz-launch").onclick = async () => {
    try {
      msgEl.textContent = "Connecting MetaMask to Oasis Sapphire Testnet...";
      await switchSapphire();

      const provider = new ethers.BrowserProvider(window.ethereum);
      const signer   = await provider.getSigner();
      const reg      = new ethers.Contract(REGISTRY_ADDR, REGISTRY_ABI, provider);

      let fee = await reg.unitFee();
      if (fee === 0n) fee = ethers.parseEther("0.01");

      msgEl.textContent = `Sending ${ethers.formatEther(fee)} TEST to fund/wake enclave...`;
      // Hits ServiceRegistry.receive() -> adds to pendingBalance & calls _trySyncBilling()
      const tx = await signer.sendTransaction({ to: REGISTRY_ADDR, value: fee });
      msgEl.textContent = `Tx sent (${tx.hash.slice(0, 10)}...). Waiting for confirmation...`;
      await tx.wait();

      const health = await waitForEnclaveWake();
      msgEl.textContent = `Funded & online (${health.tee} | WASM ${health.wasm_bytes}B). Loaded directly from ROFL enclave.`;

      frameEl.src = `${ENCLAVE_URL}/`;
      frameEl.style.display = "block";
    } catch (err) {
      msgEl.textContent = `Error: ${err.shortMessage || err.message}`;
    }
  };
</script>
